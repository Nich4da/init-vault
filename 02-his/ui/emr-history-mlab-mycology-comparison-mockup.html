<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMR History — All LAB rooms table mockup</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #fafafa;
      --line: #dcdfe6;
      --line-strong: #c0c4cc;
      --dash: #e4e7ed;
      --text: #303133;
      --regular: #606266;
      --muted: #909399;
      --green: #4e8e2f;
      --green-bg: #f0f9eb;
      --green-border: #4e8e2f;
      --amber: #946618;
      --amber-bg: #fdf6ec;
      --amber-border: #946618;
      --dx-text: #a86105;
      --dx-bg: #fff7e8;
      --dx-border: #efc98f;
      --accent: #626aef;
      --danger: #d94f54;
      --control-border: #a8abb2;
      --selected: #ebeef5;
      --hover: #f4f4ff;
      --font: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, "Noto Sans Thai", sans-serif;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0f11;
      --surface: #121416;
      --surface-2: #181b1e;
      --line: #34373b;
      --line-strong: #555a61;
      --dash: #2b2e32;
      --text: #eef0f2;
      --regular: #c8cbd0;
      --muted: #92969c;
      --green: #86d65e;
      --green-bg: #162216;
      --green-border: #5d9f43;
      --amber: #e6a23c;
      --amber-bg: #251e12;
      --amber-border: #a8782c;
      --dx-text: #f1b45d;
      --dx-bg: #2a2114;
      --dx-border: #765321;
      --accent: #8f83f6;
      --danger: #ff686d;
      --control-border: #666b72;
      --selected: #292c30;
      --hover: #202126;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.42;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(143, 131, 246, .48); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .demo-shell {
      width: calc(50vw - 12px);
      min-width: 680px;
      margin: 10px auto 36px;
    }
    .demo-shell.is-full-width {
      width: calc(100% - 20px);
      min-width: 0;
    }
    .demo-toolbar {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .demo-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .demo-note { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .demo-note::before { content: ""; width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); }
    .demo-controls { display: flex; align-items: flex-end; justify-content: flex-end; gap: 6px; flex: 0 0 auto; flex-wrap: wrap; }
    .history-control { position: relative; display: grid; gap: 2px; }
    .history-control::after {
      position: absolute;
      right: 13px;
      bottom: 13px;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      color: var(--text);
      content: "";
      pointer-events: none;
      transform: rotate(45deg);
    }
    .history-control > span { padding-left: 2px; color: var(--muted); font-size: 10px; font-weight: 500; }
    .history-select {
      min-height: 32px;
      padding: 3px 34px 3px 9px;
      border: 1px solid var(--control-border);
      border-radius: 5px;
      color: var(--text);
      background: var(--surface);
      font: 600 12px/1.2 var(--font);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .vn-control { position: relative; display: grid; gap: 2px; }
    .vn-control > span { padding-left: 2px; color: var(--muted); font-size: 10px; font-weight: 500; }
    .vn-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      min-width: 102px;
      min-height: 32px;
      padding: 3px 14px 3px 8px;
      border: 1px solid var(--control-border);
      border-radius: 5px;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .vn-trigger::after {
      width: 6px;
      height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      content: "";
      transform: translateY(-2px) rotate(45deg);
    }
    .vn-trigger[aria-expanded="true"], .vn-trigger.is-active { border-color: var(--accent); color: var(--accent); }
    .vn-popover {
      position: absolute;
      z-index: 120;
      top: calc(100% + 5px);
      right: 0;
      width: min(390px, calc(100vw - 16px));
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
    }
    .vn-popover-head, .vn-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .vn-popover-head { padding: 0 2px 8px; border-bottom: 1px solid var(--line); }
    .vn-popover-head strong { font-size: 12px; font-weight: 600; }
    .vn-limit, .vn-summary { color: var(--muted); font-size: 10px; }
    .vn-list { display: grid; max-height: 326px; overflow: auto; }
    .vn-option {
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr);
      gap: 7px;
      padding: 7px 3px;
      border-bottom: 1px dashed var(--dash);
      cursor: pointer;
    }
    .vn-option:hover { background: var(--hover); }
    .vn-option:has(input:checked) { background: var(--selected); }
    .vn-option:has(input:disabled) { cursor: not-allowed; opacity: .5; }
    .vn-checkbox { width: 14px; height: 14px; margin: 2px 0 0; accent-color: var(--accent); }
    .vn-option-content { min-width: 0; }
    .vn-option-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .vn-code { color: var(--text); font-size: 11px; font-weight: 700; }
    .vn-date { color: var(--regular); font-size: 10px; font-weight: 600; white-space: nowrap; }
    .vn-diagnosis-zone { display: flex; flex: 1 1 auto; min-width: 0; align-items: center; }
    .vn-diagnosis {
      display: block;
      overflow: hidden;
      max-width: 100%;
      padding: 2px 6px;
      border: 1px solid var(--dx-border);
      border-radius: 4px;
      color: var(--dx-text);
      background: var(--dx-bg);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .vn-diagnosis:focus-visible { outline: 2px solid color-mix(in srgb, var(--dx-text) 48%, transparent); outline-offset: 1px; }
    .vn-option-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
    .vn-order-summary { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .vn-abnormal { flex: 0 0 auto; padding: 1px 5px; border-radius: 3px; color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); font-size: 9px; font-weight: 600; white-space: nowrap; }
    .vn-summary { margin-top: 7px; padding: 0 2px; }
    .selected-vn-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      padding: 1px 2px;
    }
    .selected-vn-list[hidden] { display: none; }
    .selected-vn-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 22px 3px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      color: var(--regular);
      background: var(--surface-2);
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }
    .selected-vn-remove {
      position: absolute;
      top: 3px;
      right: 3px;
      display: grid;
      width: 16px;
      height: 16px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 3px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: 700 13px/1 var(--font);
    }
    .selected-vn-remove:hover, .selected-vn-remove:focus-visible { color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, transparent); }
    .vn-action {
      min-height: 28px;
      padding: 3px 7px;
      border: 1px solid var(--control-border);
      border-radius: 4px;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .vn-footer { display: flex; justify-content: flex-end; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .vn-action.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .vn-action:disabled { cursor: not-allowed; opacity: .5; }
    .theme-switch, .version-switch {
      display: inline-flex;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
    }
    .theme-button, .version-button {
      min-height: 27px;
      padding: 3px 10px;
      border: 0;
      border-radius: 3px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .theme-button:hover, .version-button:hover { color: var(--text); }
    .theme-button[aria-pressed="true"], .version-button[aria-pressed="true"] { color: var(--text); background: var(--selected); }
    .tabs-wrap { width: 100%; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
    .tabs {
      display: flex;
      width: max-content;
      min-width: 100%;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }
    .tab {
      flex: 1 0 auto;
      min-height: 30px;
      padding: 4px 11px;
      border: 0;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-weight: 600;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--text); background: var(--selected); }
    .tab .room-name { margin-right: 5px; }
    .tab code { color: var(--accent); font: 700 11px/1 var(--font); }

    .table-viewport { background: transparent; }
    .result-table {
      --name-col: 190px;
      --history-col: 118px;
      --current-col: 135px;
      --reference-col: 105px;
      --flag-col: 64px;
      --narrative-current-col: 230px;
      min-width: 0;
    }
    .demo-shell.is-full-width .result-table { --history-col: minmax(118px, 1fr); }
    .room-result-block {
      overflow: clip;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
    }
    .room-result-block + .room-result-block { margin-top: 6px; }
    .comparison-frame {
      --scrollbar-right: calc(var(--current-col) + var(--reference-col) + var(--flag-col));
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .comparison-frame.narrative { --scrollbar-right: calc(var(--narrative-current-col) + var(--flag-col)); }
    .comparison-scroll {
      position: relative;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
      isolation: isolate;
      contain: paint;
    }
    .comparison-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .history-scrollbar-shell {
      min-height: 10px;
      margin-right: var(--scrollbar-right);
      margin-left: var(--name-col);
      padding: 1px 0 2px;
      background: var(--surface);
    }
    .history-scrollbar {
      display: block;
      width: 100%;
      height: 7px;
      margin: 0;
      padding: 0;
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: ew-resize;
    }
    .history-scrollbar::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: var(--line);
    }
    .history-scrollbar::-webkit-slider-thumb {
      width: 38px;
      height: 7px;
      margin-top: -2px;
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--line-strong);
    }
    .history-scrollbar::-moz-range-track { height: 3px; border-radius: 999px; background: var(--line); }
    .history-scrollbar::-moz-range-thumb { width: 38px; height: 7px; border: 0; border-radius: 999px; background: var(--line-strong); }
    .history-scrollbar:focus-visible { outline: 2px solid rgba(143, 131, 246, .48); outline-offset: 2px; }
    .comparison-table { width: max-content; min-width: 100%; }
    .column-head, .result-row, .profile-row { display: grid; }
    .standard-grid {
      grid-template-columns:
        var(--name-col)
        repeat(var(--history-count), var(--history-col))
        var(--current-col)
        var(--reference-col)
        var(--flag-col);
    }
    .narrative-grid {
      grid-template-columns:
        var(--name-col)
        repeat(var(--history-count), var(--history-col))
        var(--narrative-current-col)
        var(--flag-col);
    }
    .result-table.version-v2 .standard-grid .current-cell {
      align-items: flex-end;
      padding-right: 6px;
      text-align: right;
    }
    .result-table.version-v2 .standard-grid .reference-cell {
      align-items: flex-start;
      padding-left: 6px;
      text-align: left;
    }

    .column-head {
      min-height: 28px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface-2);
      font-size: 12.5px;
      font-weight: 600;
    }
    .column-head > div { padding: 1px 10px; text-align: left; }
    .column-head .flag-head { display: flex; align-items: center; justify-content: center; padding: 1px; }
    .history-head { position: relative; z-index: 0; display: grid; align-content: center; justify-items: center; overflow: hidden; border-left: 1px solid var(--dash); text-align: center !important; }
    .history-date { color: var(--regular); font-size: 11px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
    .history-time { margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 400; line-height: 1.2; white-space: nowrap; }

    .sticky-name, .sticky-current, .sticky-reference, .sticky-flag {
      position: sticky;
      z-index: 30;
      overflow: hidden;
      background-color: var(--surface);
      background-clip: padding-box;
    }
    .standard-grid > .sticky-name, .narrative-grid > .sticky-name { grid-column: 1; }
    .standard-grid > .sticky-current { grid-column: -4; }
    .standard-grid > .sticky-reference { grid-column: -3; }
    .standard-grid > .sticky-flag { grid-column: -2; }
    .narrative-grid > .sticky-current { grid-column: -3; }
    .narrative-grid > .sticky-flag { grid-column: -2; }
    .sticky-name { left: 0; box-shadow: 2px 0 0 var(--surface), 3px 0 0 var(--line); }
    .sticky-flag { right: 0; box-shadow: -1px 0 0 var(--line); }
    .standard-grid .sticky-reference { right: var(--flag-col); }
    .standard-grid .sticky-current { right: calc(var(--flag-col) + var(--reference-col)); box-shadow: -1px 0 0 var(--line); }
    .narrative-grid .sticky-current { right: var(--flag-col); box-shadow: -1px 0 0 var(--line); }
    .column-head .sticky-name,
    .column-head .sticky-current,
    .column-head .sticky-reference,
    .column-head .sticky-flag {
      align-self: stretch;
      display: flex;
      z-index: 40;
      align-items: center;
      justify-content: flex-start;
      background-color: var(--surface-2);
    }
    .result-table.version-v2 .column-head.standard-grid .sticky-current { align-items: center; justify-content: flex-end; }
    .result-table.version-v2 .column-head.standard-grid .sticky-reference { align-items: center; justify-content: flex-start; }
    .column-head .sticky-flag { justify-content: center; }

    .group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 1px 12px;
      border-bottom: 1px dashed var(--dash);
      background: var(--surface);
    }
    .group-copy {
      flex: 1 1 auto;
      min-width: 0;
    }
    .group-summary-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }
    .group-title-text {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      color: var(--regular);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .group-summary-line > .result-time { flex: 0 0 auto; }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 1px 4px;
      border: 1px solid;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status.final { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
    .status.partial, .status.pending { border-color: var(--amber-border); color: var(--amber); background: var(--amber-bg); }
    .view-all {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 1px 4px;
      border: 1px solid var(--control-border);
      border-radius: 4px;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      text-decoration: none;
    }
    .view-all:hover { border-color: var(--accent); background: var(--hover); }
    .order-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .order-toggle {
      display: inline-grid;
      width: 24px;
      min-width: 24px;
      height: 24px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 4px;
      color: var(--regular);
      background: transparent;
      cursor: pointer;
    }
    .order-toggle:hover { color: var(--text); background: var(--selected); }
    .order-toggle::before {
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      content: "";
      transform: translateY(-2px) rotate(45deg);
      transition: transform .14s ease;
    }
    .order-toggle[aria-expanded="false"]::before { transform: translateX(-2px) rotate(-45deg); }
    .result-row { min-height: 28px; border-bottom: 1px dashed var(--dash); }
    .result-row:last-child { border-bottom: 0; }
    .result-row.narrative-grid { min-height: 64px; }
    .profile-row {
      min-height: 24px;
      align-items: center;
      color: var(--text);
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 600;
    }
    .profile-label { grid-column: 1; align-self: stretch; display: flex; align-items: center; padding: 1px 12px; background: var(--surface-2); }
    .profile-sticky-fill { align-self: stretch; min-width: 0; background-color: var(--surface-2); }
    .profile-row > .sticky-name,
    .profile-row > .sticky-current,
    .profile-row > .sticky-reference,
    .profile-row > .sticky-flag { box-shadow: none; }
    .profile-child > .name-cell { padding-left: 28px; }
    .cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      padding: 1px 12px;
      text-align: left;
    }
    .flag-cell { align-items: center; padding-left: 0; padding-right: 0; }
    .history-cell { position: relative; z-index: 0; align-items: center; overflow: hidden; border-left: 1px solid var(--dash); text-align: center; }
    .item-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .result-time, .order-comment, .test-comment { color: var(--muted); font-size: 11px; font-weight: 400; line-height: 1.3; }
    .order-comment { margin-top: 2px; }
    .test-comment { margin-top: 2px; }
    .item-sub { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 400; }
    .result-main, .previous-main, .reference-main {
      color: var(--text);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      white-space: pre-line;
    }
    .reference-main { color: var(--muted); }
    .narrative-text { font-size: 13px; line-height: 1.45; }
    .tooltip-trigger { cursor: help; }
    .tooltip-trigger:focus-visible { outline: 2px solid rgba(98, 106, 239, .4); outline-offset: 2px; border-radius: 2px; }
    .narrative-text.tooltip-trigger {
      display: -webkit-box;
      max-width: 100%;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .unit { color: var(--muted); font-size: 12px; font-weight: 400; }
    .unit { margin-left: 5px; }
    .direction-arrow {
      margin-left: 4px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }
    .previous-line { display: flex; align-items: baseline; flex-wrap: wrap; }
    .value-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .pending-text { color: var(--muted); }
    .locked-text { color: var(--muted); }
    .sensitive-button {
      min-height: 24px;
      max-width: 100%;
      padding: 1px 4px;
      overflow: hidden;
      border: 1px solid var(--control-border);
      border-radius: 4px;
      color: var(--regular);
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;

      if (hour > 23) return String(value ?? '');
      const period = hour < 12 ? 'AM' : 'PM';
      const displayHour = hour % 12 || 12;
      return `${String(displayHour).padStart(2, '0')}:${match[2]} ${period}`;

      const baseDay = match ? Number(match[1]) : 21;
      const baseMonth = match ? Number(match[2]) - 1 : 9;
      const baseDate = new Date(Date.UTC(2026, baseMonth, baseDay));
      return Array.from({ length: MAX_HISTORY_COUNT }, (_, index) => {
        const date = new Date(baseDate);
        date.setUTCDate(date.getUTCDate() - HISTORY_DAY_OFFSETS[index]);
        return {
          key: dateKey(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()),
          date: formatHistoryDate(date),
          time: formatDisplayTime(HISTORY_TIMES[index]),
          sourceIndex: index
        };
      });
    }

    function historySlots(room) {
      const available = roomHistorySlots(room);
      if (historyMode === 'count') return available.slice(0, historyCount);
      return selectedVisitIds.map((id) => {
        const visit = VISIT_OPTIONS.find((item) => item.id === id);
        if (!visit) return null;
        return {
          key: visit.id,
          date: formatHistoryDate(dateFromKey(visit.dateKey), true),
          time: formatDisplayTime(visit.time),
          sourceIndex: visit.sourceIndex
        };
      }).filter(Boolean);
    }

    function updateVnTrigger() {
      const count = selectedVisitIds.length;
      vnTriggerText.textContent = count ? `เลือก VN (${count})` : 'เลือก VN';
      vnTrigger.classList.toggle('is-active', historyMode === 'vn');
      vnTrigger.setAttribute('aria-label', count ? `เลือก VN ผลก่อนหน้า เลือกแล้ว ${count} VN` : 'เลือก VN ผลก่อนหน้า');
    }

    function renderVnOptions() {
      vnList.innerHTML = VISIT_OPTIONS.map((visit) => {
        const selected = draftVisitIds.includes(visit.id);
        const diagnosis = visit.diagnosis
          ? `<span class="vn-diagnosis-zone"><span class="vn-diagnosis tooltip-trigger"${tooltipAttributes(`Dx: ${visit.diagnosis}`)}>Dx: ${escapeHtml(visit.diagnosis)}</span></span>`
          : '<span class="vn-diagnosis-zone" aria-hidden="true"></span>';
        const abnormal = visit.abnormalCount > 0 ? `<span class="vn-abnormal">ผิดปกติ ${visit.abnormalCount} รายการ</span>` : '';
        const accessibleLabel = `${visit.id} วันที่ ${formatVisitDate(visit.dateKey)}${visit.diagnosis ? ` การวินิจฉัยหลัก ${visit.diagnosis}` : ''} รายการสั่ง ${visit.orders}${visit.abnormalCount > 0 ? ` ผิดปกติ ${visit.abnormalCount} รายการ` : ''}`;
        return `<label class="vn-option">
          <input class="vn-checkbox" type="checkbox" data-vn-id="${escapeHtml(visit.id)}" aria-label="${escapeHtml(accessibleLabel)}"${selected ? ' checked' : ''}>
          <span class="vn-option-content">
            <span class="vn-option-top"><span class="vn-code">${escapeHtml(visit.id)}</span>${diagnosis}<span class="vn-date">${escapeHtml(formatVisitDate(visit.dateKey))}</span></span>

      selectedVnList.hidden = selectedVisits.length === 0;
      selectedVnList.innerHTML = selectedVisits.map((visit) => {
        const shortDate = formatHistoryDate(dateFromKey(visit.dateKey), true);
        const removeLabel = `ลบ ${visit.id} วันที่ ${formatVisitDate(visit.dateKey)} ออกจากรายการที่เลือก`;
        return `<span class="selected-vn-chip">

        </span>`;

      vnClear.disabled = draftVisitIds.length === 0;

    function openVnDropdown() {
      draftVisitIds = [...selectedVisitIds];
      vnPopover.hidden = false;
      vnTrigger.setAttribute('aria-expanded', 'true');
      renderVnOptions();

      if (firstEnabled) firstEnabled.focus();

    function closeVnDropdown(restoreFocus = true) {
      vnPopover.hidden = true;
      vnTrigger.setAttribute('aria-expanded', 'false');
      if (restoreFocus) vnTrigger.focus();
    }

    function renderTabs() {
      roomTabs.innerHTML = FILTERS.map((filter) => `
        <button class="tab" id="tab-${filter.code}" type="button" role="tab" aria-selected="${filter.code === activeCode}" data-code="${filter.code}" tabindex="${filter.code === activeCode ? 0 : -1}">
          <span class="room-name">${escapeHtml(filter.label)}</span><code>${escapeHtml(filter.displayCode)}</code>
        </button>`).join('');

      [...roomTabs.querySelectorAll('[role="tab"]')].forEach((tab, index, tabs) => {
        tab.addEventListener('click', () => selectFilter(tab.dataset.code));
        tab.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === 'ArrowRight' ? (index + 1) % tabs.length : (index - 1 + tabs.length) % tabs.length;
          selectFilter(tabs[next].dataset.code);
          document.getElementById(`tab-${tabs[next].dataset.code}`).focus();
        });
      });
    }

    function unitHtml(unit) {
      return unit ? `<span class="unit">${escapeHtml(unit)}</span>` : '';
    }

    function directionArrowHtml(flag) {
      if (flag === 'H') return '<span class="direction-arrow" aria-hidden="true">↑</span>';
      if (flag === 'L') return '<span class="direction-arrow" aria-hidden="true">↓</span>';
      return '';
    }

    function tooltipAttributes(value) {
      const fullText = String(value ?? '');
      return ` data-tooltip="${escapeHtml(fullText)}" tabindex="0" aria-label="${escapeHtml(fullText)}"`;
    }

    function roomTestTooltip(room) {
      const lines = ['รายการตรวจทั้งหมด'];
      let activeProfile = null;
      room.rows.forEach((row) => {
        if (row.profile) {
          if (row.profile !== activeProfile) lines.push(`• ${row.profile}`);
          lines.push(`  - ${row.name}${row.sub ? ` · ${row.sub}` : ''}`);
          activeProfile = row.profile;
          return;
        }
        activeProfile = null;
        lines.push(`• ${row.name}${row.sub ? ` · ${row.sub}` : ''}`);
      });
      return lines.join('\n');
    }

    function sensitiveButtonHtml(label, roomCode, scope) {
      const accessibleLabel = `${label} · ${scope.startsWith('previous') ? 'ผลก่อนหน้า' : 'ผลครั้งนี้'}`;
      return `<button class="sensitive-button" type="button" data-sensitive-room="${escapeHtml(roomCode)}" data-sensitive-scope="${scope}" aria-label="${escapeHtml(accessibleLabel)}" title="${escapeHtml(accessibleLabel)}">ยืนยันดูผล</button>`;
    }

    function previousValueAt(row, sourceIndex) {
      if (sourceIndex < 0) return '—';
      if (Array.isArray(row.previousValues) && sourceIndex < row.previousValues.length) return row.previousValues[sourceIndex] || '—';
      if (sourceIndex === 0) return row.previous || '—';
      return '—';
    }

    function historyCellHtml(row, slot, roomCode, hasMlabTooltip) {
      const value = previousValueAt(row, slot.sourceIndex);
      const hasValue = value !== '—';
      const previousClasses = ['previous-main', row.narrative ? 'narrative-text' : '', hasMlabTooltip ? 'tooltip-trigger' : '', row.locked ? 'locked-text' : ''].filter(Boolean).join(' ');
      const content = row.locked && hasValue
        ? sensitiveButtonHtml(value, roomCode, `previous-${slot.sourceIndex}`)
        : `<span class="${previousClasses}"${hasMlabTooltip && hasValue ? tooltipAttributes(value) : ''}>${escapeHtml(value)}</span>`;
      return `<div class="cell history-cell">${content}</div>`;
    }

    function rowHtml(row, layout, roomCode, slots) {
      const gridClass = layout === 'narrative' ? 'narrative-grid' : 'standard-grid';
      const rowClasses = ['result-row', gridClass, row.profile ? 'profile-child' : '', row.flag ? 'is-flagged' : ''].filter(Boolean).join(' ');
      const hasMlabTooltip = roomCode === 'MB' && row.narrative;
      const currentClasses = ['result-main', row.narrative ? 'narrative-text' : '', hasMlabTooltip ? 'tooltip-trigger' : '', row.pending ? 'pending-text' : '', row.locked ? 'locked-text' : ''].filter(Boolean).join(' ');
      const currentValue = row.locked
        ? sensitiveButtonHtml(row.current, roomCode, 'current')
        : `<div class="${currentClasses}"${hasMlabTooltip ? tooltipAttributes(row.current) : ''}>${escapeHtml(row.current)}${unitHtml(row.unit)}${directionArrowHtml(row.flag)}</div>`;
      const historyCells = slots.map((slot) => historyCellHtml(row, slot, roomCode, hasMlabTooltip)).join('');
      return `<div class="${rowClasses}">
        <div class="cell name-cell sticky-name"><div class="item-name">${escapeHtml(row.name)}</div>${row.comment ? `<div class="test-comment">${escapeHtml(row.comment)}</div>` : ''}${row.sub ? `<div class="item-sub">${escapeHtml(row.sub)}</div>` : ''}</div>
        ${historyCells}
        <div class="cell current-cell sticky-current">${currentValue}${row.currentMeta ? `<div class="value-meta">${escapeHtml(row.currentMeta)}</div>` : ''}</div>
        ${layout === 'standard' ? `<div class="cell reference-cell sticky-reference"><div class="reference-main">${escapeHtml(row.ref ?? '—')}</div></div>` : ''}
        <div class="cell flag-cell sticky-flag" aria-label="แปลผล ${escapeHtml(row.flag || 'ไม่มี')}">${row.flag ? `<span class="flag ${row.flag === 'Critical' ? 'critical' : ''}">${escapeHtml(row.flag)}</span>` : ''}</div>
      </div>`;
    }

    function rowsHtml(room, slots) {
      const gridClass = room.layout === 'narrative' ? 'narrative-grid' : 'standard-grid';
      let activeProfile = null;
      return room.rows.map((row) => {
        const profile = row.profile && row.profile !== activeProfile
          ? `<div class="profile-row ${gridClass}">
              <div class="profile-label sticky-name">${escapeHtml(row.profile)}</div>
              <div class="profile-sticky-fill sticky-current" aria-hidden="true"></div>
              ${room.layout === 'standard' ? '<div class="profile-sticky-fill sticky-reference" aria-hidden="true"></div>' : ''}
              <div class="profile-sticky-fill sticky-flag" aria-hidden="true"></div>
            </div>`
          : '';
        if (row.profile) activeProfile = row.profile;
        return `${profile}${rowHtml(row, room.layout, room.code, slots)}`;
      }).join('');
    }

    function attachmentsHtml(room) {
      const attachments = room.attachments || [];
      if (!attachments.length) return '';
      return `<div class="attachment-list" aria-label="ไฟล์แนบของ ${escapeHtml(room.title)}">${attachments.map((file) => `
        <div class="attachment-row">
          <span class="attachment-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>
          <span class="attachment-meta">${escapeHtml(file.type)}${file.size ? ` · ${escapeHtml(file.size)}` : ''}</span>
        </div>`).join('')}
      </div>`;
    }

    function reportPath(room) {

      return `../../output/pdf/emr-history-lab-report-${reportCode}.pdf`;
    }

    function hideTooltip() {
      hoverTooltip.hidden = true;
    }

    function showTooltip(target) {
      const text = target && target.dataset.tooltip;
      if (!text) return;
      hoverTooltip.textContent = text;
      hoverTooltip.hidden = false;
      hoverTooltip.style.left = '0px';
      hoverTooltip.style.top = '0px';
      const targetRect = target.getBoundingClientRect();
      const tooltipRect = hoverTooltip.getBoundingClientRect();
      const edge = 8;
      let left = Math.min(targetRect.left, globalThis.innerWidth - tooltipRect.width - edge);
      left = Math.max(edge, left);
      let top = targetRect.bottom + edge;
      if (top + tooltipRect.height > globalThis.innerHeight - edge) top = targetRect.top - tooltipRect.height - edge;
      hoverTooltip.style.left = `${left}px`;
      hoverTooltip.style.top = `${Math.max(edge, top)}px`;
    }

    function bindTooltips(root = resultTable) {
      root.querySelectorAll('[data-tooltip]').forEach((target) => {
        target.addEventListener('mouseenter', () => showTooltip(target));
        target.addEventListener('mouseleave', hideTooltip);
        target.addEventListener('focus', () => showTooltip(target));
        target.addEventListener('blur', hideTooltip);
      });
    }

    function historyHeaderHtml(slots) {
      return slots.map((slot) => `
        <div class="history-head" aria-label="ผลก่อนหน้า ${escapeHtml(slot.date)} ${escapeHtml(slot.time)}">
          <span class="history-date">${escapeHtml(slot.date)}</span>
          <span class="history-time">${escapeHtml(slot.time)}</span>
        </div>`).join('');
    }

    function roomBlockHtml(room) {
      const slots = historySlots(room);
      const selectedCount = slots.length;
      const gridClass = room.layout === 'narrative' ? 'narrative-grid' : 'standard-grid';
      const statusClass = room.status === 'Final' ? 'final' : room.status === 'Partial result' ? 'partial' : 'pending';
      const testTooltip = roomTestTooltip(room);
      const isExpanded = !collapsedOrders.has(room.code);
      const bodyId = `order-body-${room.code.replace(/[^a-z0-9_-]/gi, '-')}`;
      const toggleLabel = `${isExpanded ? 'ยุบ' : 'กาง'}ผลตรวจ ${room.title}`;
      const reportActionTitle = `เปิด PDF รายงานผล ${room.title}`;
      const attachments = room.attachments || [];
      return `<section class="room-result-block${isExpanded ? '' : ' is-collapsed'}${attachments.length ? ' has-attachments' : ''}" aria-label="${escapeHtml(room.label)} ${escapeHtml(room.code)}">
        <header class="group-head">
          <div class="group-copy tooltip-trigger"${tooltipAttributes(testTooltip)}>
            <div class="group-summary-line"><span class="group-title-text">${escapeHtml(room.title)}</span><span class="result-time">${escapeHtml(formatDisplayTime(room.time))}</span></div>
            ${room.orderComment ? `<div class="order-comment">${escapeHtml(room.orderComment)}</div>` : ''}
          </div>
          <div class="order-actions">
            <span class="status ${statusClass}">${escapeHtml(room.status)}</span>
            <a class="view-all report-action" href="${escapeHtml(reportPath(room))}" target="_blank" rel="noopener" title="${escapeHtml(reportActionTitle)}" aria-label="${escapeHtml(reportActionTitle)}">รายงานผล</a>
            <button class="order-toggle" type="button" data-order-code="${escapeHtml(room.code)}" aria-expanded="${isExpanded}" aria-controls="${bodyId}" aria-label="${escapeHtml(toggleLabel)}" title="${escapeHtml(toggleLabel)}"></button>
          </div>
        </header>
        <div class="comparison-frame ${room.layout}" id="${bodyId}"${isExpanded ? '' : ' hidden'}>
          <div class="comparison-scroll" data-order-code="${escapeHtml(room.code)}" tabindex="0" aria-label="ตารางเปรียบเทียบผลย้อนหลัง ${selectedCount} ครั้ง">
            <div class="comparison-table" style="--history-count:${selectedCount}">
              <div class="column-head ${gridClass}">
                <div class="sticky-name">รายการ</div>
                ${historyHeaderHtml(slots)}
                <div class="current-cell sticky-current">ครั้งนี้</div>
                ${room.layout === 'standard' ? '<div class="reference-cell sticky-reference">ค่าปกติ</div>' : ''}
                <div class="flag-head sticky-flag">แปลผล</div>
              </div>
              <div class="order-body">${rowsHtml(room, slots)}</div>
            </div>
          </div>
          <div class="history-scrollbar-shell" hidden>
            <input class="history-scrollbar" type="range" min="0" max="0" value="0" step="1" data-order-code="${escapeHtml(room.code)}" aria-label="เลื่อนคอลัมน์ผลก่อนหน้าของ ${escapeHtml(room.title)}">
          </div>
        </div>
        ${attachmentsHtml(room)}
      </section>`;
    }

    function bindOrderToggles() {
      resultTable.querySelectorAll('.order-toggle').forEach((button) => {
        button.addEventListener('click', () => {
          const room = ROOMS.find((item) => item.code === button.dataset.orderCode);
          const body = document.getElementById(button.getAttribute('aria-controls'));
          const block = button.closest('.room-result-block');
          if (!room || !body || !block) return;
          const nextExpanded = button.getAttribute('aria-expanded') !== 'true';
          if (nextExpanded) collapsedOrders.delete(room.code);
          else collapsedOrders.add(room.code);
          button.setAttribute('aria-expanded', String(nextExpanded));
          const label = `${nextExpanded ? 'ยุบ' : 'กาง'}ผลตรวจ ${room.title}`;
          button.setAttribute('aria-label', label);
          button.setAttribute('title', label);
          body.hidden = !nextExpanded;
          block.classList.toggle('is-collapsed', !nextExpanded);
          if (nextExpanded) requestAnimationFrame(() => updateHistoryScrollbar(body));
        });
      });
    }

    function fitStickyColumns(frame) {
      const scroll = frame?.querySelector('.comparison-scroll');
      if (!scroll) return;
      const available = scroll.clientWidth;
      const narrow = available < 620;
      const historyFloor = available < 420 ? 72 : narrow ? 92 : 118;
      const narrative = frame.classList.contains('narrative');
      const ideal = narrative ? [190, 230, 64] : [190, 135, 105, 64];
      const minimum = narrative ? [124, 172, 42] : [124, 96, 76, 42];
      const idealTotal = ideal.reduce((sum, value) => sum + value, 0);
      const minimumTotal = minimum.reduce((sum, value) => sum + value, 0);
      const sideBudget = Math.max(1, available - historyFloor);
      let widths;
      if (sideBudget >= idealTotal) {
        widths = ideal;
      } else if (sideBudget >= minimumTotal) {
        const ratio = (sideBudget - minimumTotal) / (idealTotal - minimumTotal);
        widths = minimum.map((value, index) => value + ((ideal[index] - value) * ratio));
      } else {
        const ratio = sideBudget / minimumTotal;
        widths = minimum.map((value) => value * ratio);
      }
      frame.style.setProperty('--name-col', `${widths[0]}px`);
      if (narrative) {
        frame.style.setProperty('--narrative-current-col', `${widths[1]}px`);
        frame.style.setProperty('--flag-col', `${widths[2]}px`);
      } else {
        frame.style.setProperty('--current-col', `${widths[1]}px`);
        frame.style.setProperty('--reference-col', `${widths[2]}px`);
        frame.style.setProperty('--flag-col', `${widths[3]}px`);
      }
    }

    function fitHistoryColumns(frame) {
      const scroll = frame?.querySelector('.comparison-scroll');
      const table = frame?.querySelector('.comparison-table');
      const head = table?.querySelector('.column-head');
      const name = head?.querySelector('.sticky-name');
      const stickyRight = head ? [...head.querySelectorAll('.sticky-current, .sticky-reference, .sticky-flag')] : [];
      if (!scroll || !table || !name || !stickyRight.length) return 1;
      fitStickyColumns(frame);
      const count = Number.parseInt(getComputedStyle(table).getPropertyValue('--history-count'), 10) || 1;
      const rightWidth = stickyRight.reduce((sum, cell) => sum + cell.getBoundingClientRect().width, 0);
      const corridorWidth = Math.max(1, scroll.clientWidth - name.getBoundingClientRect().width - rightWidth);
      const readableFloor = scroll.clientWidth < 420 ? 72 : scroll.clientWidth < 620 ? 92 : 118;
      const visibleCount = Math.max(1, Math.min(count, Math.floor(corridorWidth / readableFloor)));
      const columnWidth = corridorWidth / visibleCount;
      table.style.setProperty('--history-col', `${columnWidth}px`);
      return columnWidth;
    }

    function updateHistoryScrollbar(frame) {
      if (!frame || frame.hidden) return;
      const scroll = frame.querySelector('.comparison-scroll');
      const shell = frame.querySelector('.history-scrollbar-shell');
      const range = frame.querySelector('.history-scrollbar');
      if (!scroll || !shell || !range) return;
      fitHistoryColumns(frame);
      const max = Math.max(0, Math.ceil(scroll.scrollWidth - scroll.clientWidth));
      const current = Math.min(max, Math.max(0, scroll.scrollLeft));
      shell.hidden = max <= 1;
      range.max = String(max);
      range.step = '1';
      range.value = String(Math.round(current));
    }

    function bindHistoryScrollbars() {
      resultTable.querySelectorAll('.comparison-frame').forEach((frame) => {
        const scroll = frame.querySelector('.comparison-scroll');
        const range = frame.querySelector('.history-scrollbar');
        if (!scroll || !range) return;
        scroll.addEventListener('scroll', () => {
          range.value = String(Math.round(scroll.scrollLeft));
        }, { passive: true });
        range.addEventListener('input', () => {
          const max = Number(range.max) || 0;
          scroll.scrollLeft = Math.min(max, Math.max(0, Number(range.value)));
        });
        updateHistoryScrollbar(frame);
      });
    }

    function refreshHistoryScrollbars() {
      resultTable.querySelectorAll('.comparison-frame').forEach(updateHistoryScrollbar);
    }

    function renderRoom() {
      hideTooltip();
      const activeFilter = FILTERS.find((filter) => filter.code === activeCode) || FILTERS[0];
      const visibleRooms = ROOMS.filter((room) => activeFilter.rooms.includes(room.code));
      resultTable.setAttribute('aria-labelledby', `tab-${activeCode}`);
      resultTable.classList.toggle('all-results', activeCode === 'ALL');
      const versionMeta = VERSION_META[activeVersion] || VERSION_META.v2;
      resultTable.classList.toggle('version-v2', versionMeta.paired);
      resultTable.innerHTML = visibleRooms.map(roomBlockHtml).join('');
      resultTable.querySelectorAll('.sensitive-button').forEach((button) => {
        button.addEventListener('click', (event) => openSensitivePrompt(event.currentTarget));
      });
      bindOrderToggles();
      bindHistoryScrollbars();
      bindTooltips();
    }

    function selectFilter(code) {
      activeCode = code;
      renderTabs();
      renderRoom();
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.themeOption === theme));
      });
    }

    function setVersion(version) {
      activeVersion = version;
      const versionMeta = VERSION_META[version] || VERSION_META.v2;
      versionButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.versionOption === version));
      });
      demoNote.textContent = versionMeta.note;
      demoShell.classList.toggle('is-full-width', versionMeta.fullWidth);
      renderRoom();
    }

    function openSensitivePrompt(trigger) {
      const room = ROOMS.find((item) => item.code === trigger.dataset.sensitiveRoom);
      const scope = trigger.dataset.sensitiveScope.startsWith('previous') ? 'ผลก่อนหน้า' : 'ผลครั้งนี้';
      modalTitle.textContent = 'ยืนยันตัวตนเพื่อดูผล Sensitive';
      modalNote.textContent = 'Mockup เท่านั้น · ไม่เชื่อมต่อข้อมูลผู้ป่วยหรือระบบยืนยันตัวตนจริง';
      modalRaw.textContent = `${room.label} (${room.code}) · ${scope}\n\nระบบจริงจะแสดงขั้นตอนยืนยันตัวตนก่อนเปิดเผยผล`;
      returnFocus = trigger;
      modal.hidden = false;
      modal.querySelector('[data-close]').focus();
    }

    function closeModal() {
      modal.hidden = true;
      if (returnFocus) returnFocus.focus();
    }

    vnTrigger.addEventListener('click', () => {
      if (vnPopover.hidden) openVnDropdown();
      else closeVnDropdown();
    });
    vnList.addEventListener('change', (event) => {
      event.stopPropagation();
      const checkbox = event.target.closest('[data-vn-id]');
      if (!checkbox) return;
      const id = checkbox.dataset.vnId;
      if (checkbox.checked) draftVisitIds.push(id);
      else if (!checkbox.checked) draftVisitIds = draftVisitIds.filter((item) => item !== id);
      draftVisitIds = VISIT_OPTIONS.filter((visit) => draftVisitIds.includes(visit.id)).map((visit) => visit.id);
      renderVnOptions();
    });
    selectedVnList.addEventListener('click', (event) => {
      event.stopPropagation();
      const removeButton = event.target.closest('[data-remove-vn]');
      if (!removeButton) return;
      const removeButtons = [...selectedVnList.querySelectorAll('[data-remove-vn]')];
      const removedIndex = removeButtons.indexOf(removeButton);
      draftVisitIds = draftVisitIds.filter((item) => item !== removeButton.dataset.removeVn);
      renderVnOptions();
      const remainingButtons = [...selectedVnList.querySelectorAll('[data-remove-vn]')];
      if (remainingButtons.length) remainingButtons[Math.min(removedIndex, remainingButtons.length - 1)].focus();
      else vnList.querySelector('input:not(:disabled)')?.focus();
    });
    vnClear.addEventListener('click', () => {
      draftVisitIds = [];
      renderVnOptions();
    });
    vnCancel.addEventListener('click', () => closeVnDropdown());
    vnApply.addEventListener('click', () => {
      if (!draftVisitIds.length) return;
      selectedVisitIds = VISIT_OPTIONS.filter((visit) => draftVisitIds.includes(visit.id)).map((visit) => visit.id);
      historyMode = 'vn';
      updateVnTrigger();
      closeVnDropdown();
      renderRoom();
    });

    document.querySelectorAll('[data-close]').forEach((button) => button.addEventListener('click', closeModal));
    themeButtons.forEach((button) => button.addEventListener('click', () => setTheme(button.dataset.themeOption)));
    versionButtons.forEach((button) => button.addEventListener('click', () => setVersion(button.dataset.versionOption)));
    historyCountSelect.addEventListener('change', () => {
      historyCount = Number(historyCountSelect.value);
      historyMode = 'count';
      updateVnTrigger();
      closeVnDropdown(false);
      renderRoom();
    });
    modal.addEventListener('click', (event) => { if (event.target === modal) closeModal(); });
    document.addEventListener('click', (event) => {
      if (!vnPopover.hidden && !event.composedPath().includes(vnPopover) && !event.composedPath().includes(vnTrigger)) closeVnDropdown(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!vnPopover.hidden) closeVnDropdown();
      else if (!modal.hidden) closeModal();
    });
    globalThis.addEventListener('scroll', hideTooltip, true);
    globalThis.addEventListener('resize', () => {
      hideTooltip();
      refreshHistoryScrollbars();
    });

    updateVnTrigger();
    renderVnOptions();
    renderTabs();
    renderRoom();
  </script>
</body>
</html>
